<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f4f7" />
    <title>你宠啥 · 商家调度台</title>
    <script>
      // 主题在首帧之前定好，避免「白闪一下再变深」。
      // 规则：本地有记录用记录；没有就跟随系统；系统也不支持就默认浅色。
      (function () {
        try {
          var saved = localStorage.getItem('ui_theme');
          var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.background = dark ? '#0a0f12' : '#f2f4f7';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0a0f12' : '#f2f4f7');
          var scheme = document.querySelector('meta[name="color-scheme"]');
          if (scheme) scheme.setAttribute('content', dark ? 'dark' : 'light');
        } catch (e) {
          /* localStorage 被禁用时按浅色渲染即可，不影响使用 */
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
